<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>数独</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, 'PingFang SC', sans-serif; background: linear-gradient(160deg, #2c3e50, #4ca1af); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .app { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .top { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #2c3e50; margin-bottom: 10px; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  td { border: 1px solid #bbb; aspect-ratio: 1; text-align: center; vertical-align: middle; position: relative; }
  td.br { border-right: 2.5px solid #2c3e50; }
  td.bb { border-bottom: 2.5px solid #2c3e50; }
  td.given { background: #eef2f5; font-weight: 700; color: #2c3e50; font-size: clamp(12px, 4vw, 18px); }
  td input { width: 100%; height: 100%; border: 0; text-align: center; font-size: clamp(12px, 4vw, 18px); font-weight: 700; color: #2980b9; background: transparent; outline: none; padding: 0; }
  td input:focus { background: #fff7d6; }
  td.err input { color: #e74c3c; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btns button { flex: 1; padding: 10px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .check { background: #27ae60; color: #fff; }
  .hint { background: #f39c12; color: #fff; }
  .msg { text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; color: #888; }
  .final { text-align: center; padding: 30px 0; }
  .final h1 { color: #2c3e50; font-size: 40px; margin: 8px 0; }
  .final p { color: #888; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div id="play">
    <div class="top">
      <span id="timer">⏱ 00:00</span>
      <span id="level">难度 · 中</span>
    </div>
    <table id="board"></table>
    <div class="msg" id="msg"></div>
    <div class="btns">
      <button class="check" id="checkBtn">检查</button>
      <button class="hint" id="hintBtn">提示一格</button>
    </div>
  </div>
  <div id="done" class="final hidden">
    <h1>🎉 完成</h1>
    <p id="finalText"></p>
  </div>
</div>
<script src="../shared/protocol.js"></script>
<script>
/**
 * 数独（T055，game-native，仅数学）
 * 盘面由模板内置生成器按难度生成（宪法 P1：零数据自包含可玩）。
 * 宿主下发的 difficulty(1/2/3) 决定挖空数量；result.correctCount 报完成情况，宿主用题目数计总分。
 */
(function () {
  'use strict'
  var DEFAULT_DATA = { game: { title: '数独' }, difficulty: 2, total: 1 }

  var solution = []
  var givens = []   // true=固定格
  var holes = 0
  var hintUsed = 0
  var startedAt = 0
  var tick = null
  var inputEls = []

  function $(id) { return document.getElementById(id) }

  window.GameProtocol.boot({
    onInit: function (data) {
      var diff = (data && data.difficulty) || DEFAULT_DATA.difficulty
      holes = diff === 1 ? 30 : diff === 2 ? 42 : 52
      $('level').textContent = '难度 · ' + (['易', '中', '难'][diff - 1] || '中')
      gen()
      render()
      GameProtocol.ready()
    },
    onStart: function () {
      startedAt = Date.now()
      tick = setInterval(function () {
        var s = Math.floor((Date.now() - startedAt) / 1000)
        $('timer').textContent = '⏱ ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
      }, 500)
    },
  }, DEFAULT_DATA)

  /* ---------- 盘面生成：基础盘 → 带内打乱行/列 → 挖空 ---------- */
  function gen() {
    var base = [
      [1,2,3,4,5,6,7,8,9],[4,5,6,7,8,9,1,2,3],[7,8,9,1,2,3,4,5,6],
      [2,3,4,5,6,7,8,9,1],[5,6,7,8,9,1,2,3,4],[8,9,1,2,3,4,5,6,7],
      [3,4,5,6,7,8,9,1,2],[6,7,8,9,1,2,3,4,5],[9,1,2,3,4,5,6,7,8],
    ]
    var b = base.map(function (r) { return r.slice() })
    // 行/列带内交换
    for (var band = 0; band < 3; band++) {
      var order = [0, 1, 2].sort(function () { return Math.random() - 0.5 })
      var rows = order.map(function (o) { return b[band * 3 + o] })
      for (var i = 0; i < 3; i++) b[band * 3 + i] = rows[i]
    }
    // 数字替换
    var map = {}
    var nums = [1,2,3,4,5,6,7,8,9].sort(function () { return Math.random() - 0.5 })
    for (var n = 1; n <= 9; n++) map[n] = nums[n - 1]
    solution = b.map(function (row) { return row.map(function (v) { return map[v] }) })

    givens = []
    for (var r = 0; r < 9; r++) givens.push([false,false,false,false,false,false,false,false,false])
    var all = []
    for (var r2 = 0; r2 < 9; r2++) for (var c2 = 0; c2 < 9; c2++) all.push([r2, c2])
    all.sort(function () { return Math.random() - 0.5 })
    var removed = 0
    for (var k = 0; k < all.length && removed < holes; k++) {
      givens[all[k][0]][all[k][1]] = false
      removed++
    }
    // 标记保留格
    all.slice(removed).forEach(function (rc) { givens[rc[0]][rc[1]] = true })
    hintUsed = 0
  }

  function render() {
    var table = $('board')
    table.innerHTML = ''
    inputEls = []
    for (var r = 0; r < 9; r++) {
      var tr = document.createElement('tr')
      var rowEls = []
      for (var c = 0; c < 9; c++) {
        var td = document.createElement('td')
        if (c === 2 || c === 5) td.classList.add('br')
        if (r === 2 || r === 5) td.classList.add('bb')
        if (givens[r][c]) {
          td.classList.add('given')
          td.textContent = solution[r][c]
        } else {
          var inp = document.createElement('input')
          inp.setAttribute('inputmode', 'numeric')
          inp.setAttribute('maxlength', '1')
          inp.dataset.r = r; inp.dataset.c = c
          inp.addEventListener('input', function (e) { e.target.value = e.target.value.replace(/[^1-9]/g, '') })
          td.appendChild(inp)
          rowEls.push(inp)
        }
        tr.appendChild(td)
      }
      inputEls.push(rowEls)
      table.appendChild(tr)
    }
  }

  function filled(r, c) {
    if (givens[r][c]) return true
    var v = inputEls[r][c] ? inputEls[r][c].value : ''
    return v !== '' && Number(v) === solution[r][c]
  }

  $('checkBtn').onclick = function () {
    var filledCount = 0, correct = 0, wrongCells = []
    for (var r = 0; r < 9; r++) for (var c = 0; c < 9; c++) {
      if (givens[r][c]) { filledCount++; correct++; continue }
      var inp = inputEls[r][c]
      if (!inp) continue
      var v = inp.value
      td(inp).classList.remove('err')
      if (v === '') continue
      filledCount++
      if (Number(v) === solution[r][c]) correct++
      else { td(inp).classList.add('err'); wrongCells.push(inp) }
    }
    if (correct === 81) return finish()
    if (wrongCells.length) $('msg').textContent = '有 ' + wrongCells.length + ' 处错误（红色标出）'
    else if (filledCount < 81) $('msg').textContent = '已填部分全部正确，继续加油！'
    else $('msg').textContent = '还有空格未填'
  }

  function countGiven() {
    var n = 0
    for (var r = 0; r < 9; r++) for (var c = 0; c < 9; c++) if (givens[r][c]) n++
    return n
  }

  function td(inp) { return inp.parentElement }

  $('hintBtn').onclick = function () {
    var empties = []
    for (var r = 0; r < 9; r++) for (var c = 0; c < 9; c++) {
      if (!givens[r][c] && inputEls[r][c] && inputEls[r][c].value !== String(solution[r][c])) empties.push(inputEls[r][c])
    }
    if (!empties.length) return
    var inp = empties[Math.floor(Math.random() * empties.length)]
    inp.value = solution[Number(inp.dataset.r)][Number(inp.dataset.c)]
    hintUsed++
    $('msg').textContent = '已提示 ' + hintUsed + ' 格'
  }

  function finish() {
    clearInterval(tick)
    var dur = Date.now() - startedAt
    $('play').classList.add('hidden')
    $('done').classList.remove('hidden')
    $('finalText').textContent = '用时 ' + Math.round(dur / 1000) + ' 秒（提示 ' + hintUsed + ' 格），正在结算…'
    GameProtocol.result({
      score: 1, // 完成即得 1 分（宿主按题目总数折算）
      total: 1,
      durationMs: dur,
      answers: [],
      extra: { hintUsed: hintUsed },
    })
  }
})()
</script>
</body>
</html>
