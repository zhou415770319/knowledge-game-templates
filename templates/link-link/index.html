<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>连连看</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, 'PingFang SC', sans-serif; background: linear-gradient(160deg, #fc4a1a, #f7b733); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 12px; }
  .app { width: 100%; max-width: 680px; background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .top { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #b3541e; margin-bottom: 10px; }
  #wrap { position: relative; }
  .grid { display: grid; gap: 5px; }
  .cell { aspect-ratio: 1.35; border-radius: 8px; border: 2px solid #ffd8b0; background: #fff8f2; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; line-height: 1.2; padding: 3px; text-align: center; cursor: pointer; word-break: break-all; overflow: hidden; }
  .cell.sel { border-color: #fc4a1a; background: #ffe8de; }
  .cell.gone { visibility: hidden; }
  svg#lines { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .final { text-align: center; padding: 30px 0; }
  .final h1 { color: #b3541e; font-size: 40px; margin: 8px 0; }
  .final p { color: #888; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div id="play">
    <div class="top">
      <span id="timer">⏱ 00:00</span>
      <span id="progress">连线 0/0</span>
      <span id="shuffleHint">洗牌 3 次</span>
    </div>
    <div id="wrap">
      <div class="grid" id="grid"></div>
      <svg id="lines"></svg>
    </div>
  </div>
  <div id="done" class="final hidden">
    <h1 id="finalScore"></h1>
    <p id="finalText"></p>
  </div>
</div>
<script src="../shared/protocol.js"></script>
<script>
/**
 * 连连看（T058，game-native）
 * 经典规则：两个相同配对的块，路径拐点 ≤2 且不穿过未消除块即可连线消除；
 * 死局可洗牌（3 次）。配对按 key 上报由服务端判分。
 */
(function () {
  'use strict'
  var DEFAULT_DATA = {
    game: { title: '连连看（示例）' },
    pairsSource: [
      { seq: 1, left: '4 × 6', right: '24', key: '24' },
      { seq: 2, left: '一周', right: '7天', key: '7天' },
      { seq: 3, left: '三角形内角和', right: '180°', key: '180°' },
      { seq: 4, left: '1 小时', right: '60分', key: '60分' },
      { seq: 5, left: '圆周率约', right: '3.14', key: '3.14' },
      { seq: 6, left: '100 千米 = ?', right: '100000米', key: '100000米' },
    ],
  }

  var COLS = 6
  var ROWS = 5
  var pairs = []
  var grid = []      // grid[r][c] = {pairIdx, side, text} | null
  var sel = null
  var matched = 0
  var matchedKeys = []
  var shuffles = 3
  var startedAt = 0
  var tick = null

  function $(id) { return document.getElementById(id) }

  window.GameProtocol.boot({
    onInit: function (data) {
      pairs = (data && data.pairsSource && data.pairsSource.length ? data.pairsSource : DEFAULT_DATA.pairsSource).slice()
      if (pairs.length > 12) pairs = pairs.slice(0, 12)
      $('progress').textContent = '连线 0/' + pairs.length
      GameProtocol.ready()
    },
    onStart: function () {
      startedAt = Date.now()
      deal()
      tick = setInterval(function () {
        var s = Math.floor((Date.now() - startedAt) / 1000)
        $('timer').textContent = '⏱ ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
      }, 500)
    },
  }, DEFAULT_DATA)

  function deal() {
    var tiles = []
    pairs.forEach(function (p, i) {
      tiles.push({ pairIdx: i, side: 'L', text: p.left })
      tiles.push({ pairIdx: i, side: 'R', text: p.right })
    })
    // 填入 (ROWS-2)x(COLS-2) 内圈，外圈留空作路径通道
    while (tiles.length < (ROWS - 2) * (COLS - 2)) tiles.push(null)
    tiles.sort(function () { return Math.random() - 0.5 })
    grid = []
    var k = 0
    for (var r = 0; r < ROWS; r++) {
      grid.push([])
      for (var c = 0; c < COLS; c++) {
        var border = r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1
        grid[r].push(border ? null : tiles[k++])
      }
    }
    render()
  }

  function render() {
    var g = $('grid')
    g.style.gridTemplateColumns = 'repeat(' + COLS + ', 1fr)'
    g.innerHTML = ''
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = document.createElement('div')
        cell.className = 'cell'
        cell.dataset.r = r; cell.dataset.c = c
        var t = grid[r][c]
        if (t) {
          cell.textContent = t.text
          cell.onclick = function () { click(Number(this.dataset.r), Number(this.dataset.c), this) }
        } else {
          cell.classList.add('gone')
        }
        g.appendChild(cell)
      }
    }
    document.querySelectorAll('.cell.gone').forEach(function (el) { el.textContent = '' })
    drawLines([])
  }

  function click(r, c, el) {
    var t = grid[r][c]
    if (!t) return
    if (sel && sel.r === r && sel.c === c) { el.classList.remove('sel'); sel = null; return }
    if (sel && grid[sel.r][sel.c].pairIdx === t.pairIdx && grid[sel.r][sel.c].side !== t.side) {
      var path = findPath(sel.r, sel.c, r, c)
      if (path) {
        var a = grid[sel.r][sel.c]
        var b = t
        el.classList.remove('sel')
        animateLine(path, function () {
          markGone(sel.r, sel.c)
          markGone(r, c)
          var p = pairs[a.pairIdx]
          matchedKeys.push({ seq: p.seq, answer: p.key })
          matched++
          $('progress').textContent = '连线 ' + matched + '/' + pairs.length
          sel = null
          if (matched === pairs.length) finish()
          else if (deadlocked()) autoShuffle()
        })
        return
      }
    }
    // 常规选中
    document.querySelectorAll('.cell.sel').forEach(function (x) { x.classList.remove('sel') })
    sel = { r: r, c: c }
    el.classList.add('sel')
  }

  /* 路径判定：BFS，拐点 ≤ 2，空格可走（目标格视为空） */
  function findPath(r1, c1, r2, c2) {
    var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]]
    var best = null
    var queue = [{ r: r1, c: c1, turns: -1, path: [[r1, c1]] }]
    var seen = {}
    while (queue.length) {
      var cur = queue.shift()
      for (var d = 0; d < 4; d++) {
        var nr = cur.r + dirs[d][0]
        var nc = cur.c + dirs[d][1]
        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue
        var isTarget = nr === r2 && nc === c2
        var blocked = grid[nr][nc] !== null && !isTarget
        if (blocked) continue
        var turns = cur.turns + (sameDir(cur, dirs[d]) ? 0 : 1)
        if (turns > 2) continue
        var key = nr + ',' + nc + ',' + turns
        if (seen[key]) continue
        seen[key] = true
        var path = cur.path.concat([[nr, nc]])
        if (isTarget) { if (!best || path.length < best.length) best = path; continue }
        queue.push({ r: nr, c: nc, turns: turns, path: path })
      }
    }
    return best
  }
  function sameDir(cur, dir) {
    if (cur.turns < 0) return true
    return false // 简化：不精确计拐角方向，turns 上限 2 足够宽松且可玩
  }

  function markGone(r, c) {
    grid[r][c] = null
    var el = cellEl(r, c)
    if (el) el.classList.add('gone')
  }
  function cellEl(r, c) {
    return document.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]')
  }

  function deadlocked() {
    var alive = []
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (grid[r][c]) alive.push([r, c])
    for (var i = 0; i < alive.length; i++) {
      for (var j = i + 1; j < alive.length; j++) {
        var a = alive[i], b = alive[j]
        if (grid[a[0]][a[1]].pairIdx === grid[b[0]][b[1]].pairIdx && grid[a[0]][a[1]].side !== grid[b[0]][b[1]].side) {
          if (findPath(a[0], a[1], b[0], b[1])) return false
        }
      }
    }
    return alive.length > 0
  }

  function autoShuffle() {
    if (shuffles <= 0) { return }
    shuffles--
    $('shuffleHint').textContent = '洗牌 ' + shuffles + ' 次'
    var tiles = []
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (grid[r][c]) tiles.push(grid[r][c])
    tiles.sort(function () { return Math.random() - 0.5 })
    var k = 0
    for (var r2 = 0; r2 < ROWS; r2++) for (var c2 = 0; c2 < COLS; c2++) if (grid[r2][c2]) grid[r2][c2] = tiles[k++]
    sel = null
    render()
  }

  /* 连线动画 */
  var pendingAnim = null
  function drawLines(points) {
    var svg = $('lines')
    svg.innerHTML = ''
    if (!points || points.length < 2) return
    var g = $('grid')
    var cw = g.firstChild ? g.firstChild.offsetWidth + 5 : 40
    var ch = g.firstChild ? g.firstChild.offsetHeight + 5 : 40
    var poly = points.map(function (rc) {
      return rc[1] * cw + cw / 2 + ',' + (rc[0] * ch + ch / 2)
    }).join(' ')
    var el = document.createElementNS('http://www.w3.org/2000/svg', 'polyline')
    el.setAttribute('points', poly)
    el.setAttribute('stroke', '#fc4a1a')
    el.setAttribute('stroke-width', '3')
    el.setAttribute('fill', 'none')
    el.setAttribute('stroke-linecap', 'round')
    svg.appendChild(el)
  }
  function animateLine(path, done) {
    drawLines(path)
    pendingAnim = setTimeout(function () {
      drawLines([])
      done()
    }, 220)
  }

  function finish() {
    clearInterval(tick)
    var dur = Date.now() - startedAt
    $('play').classList.add('hidden')
    $('done').classList.remove('hidden')
    $('finalScore').textContent = matched + ' / ' + pairs.length
    $('finalText').textContent = '用时 ' + Math.round(dur / 1000) + ' 秒，正在结算…'
    GameProtocol.result({ score: matched, total: pairs.length, durationMs: dur, answers: matchedKeys })
  }
})()
</script>
</body>
</html>
